name: Task Reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-tasks:
    runs-on: ubuntu-latest

    steps:
      - name: Check tasks
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "🔔 فحص المهام..."
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "✅ Firebase Secret موجود"
          else
            echo "❌ Firebase Secret غير موجود"
            exit 1
          fi
